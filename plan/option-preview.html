<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0F0F12}
.wrap{padding:14px 16px}.tag{display:inline-block;font-weight:800;font-size:11px;letter-spacing:1.6px;padding:4px 10px;border-radius:999px;margin:6px 0 10px}
.old{background:#FEF2F2;color:#B91C1C}.new{background:#EAF7EE;color:#15803D}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.8px;color:#74747E;margin:4px 0 8px}
.card{display:flex;align-items:center;gap:10px;min-height:60px;padding:10px;border-radius:16px;border:1.5px solid #ECECF0;background:#FFFFFF;margin-bottom:10px}
.chip{width:32px;height:32px;border-radius:16px;border:1.5px solid #DEDEE4;background:#F6F6F8;display:flex;align-items:center;justify-content:center;font:700 14px ui-monospace,monospace;flex:none}
.tick{width:26px;height:26px;border-radius:13px;border:1.5px solid #DEDEE4;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;font-weight:900;font-size:14px}
.paper{flex:1;min-height:40px;border:1px solid #ECECF0;border-radius:10px;background:#fff;display:flex;align-items:center;padding:0 12px;font-size:15px;font-family:'Times New Roman',serif}
.redOn{border-color:#D91222;background:#FFF1F2;box-shadow:0 6px 12px rgba(217,18,34,.22)}.redFill{background:#D91222;border-color:#D91222;color:#fff}
.greenOn{border:2px solid #4ADE80;background:#F0FBF3;box-shadow:0 6px 12px rgba(22,163,74,.18)}.greenFill{background:#16A34A;border-color:#16A34A;color:#fff}
.note{font-size:12px;color:#3C3C44;margin:2px 0 6px}.line{height:1px;background:#ECECF0;margin:12px 0}
.text{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;border-radius:16px;border:1.5px solid #ECECF0;background:#fff;margin-bottom:10px;font-size:15px}
.letter{width:30px;height:30px;border-radius:15px;border:1.5px solid #D9D9DF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#3C3C44;flex:none}
</style></head><body><div class="wrap">
<span class="tag old">ABHI · SELECT KARNE PAR RED</span>
<div class="eyebrow">SELECT ONE ANSWER</div>
<div class="card"><div class="chip">1</div><div class="paper">2√3 m/s</div><div class="tick"></div></div>
<div class="card redOn"><div class="chip redFill">2</div><div class="paper">4 m/s</div><div class="tick redFill">✓</div></div>
<div class="line"></div>
<span class="tag new">NAYA · SELECT KARNE PAR GREEN</span>
<div class="note">Halka green border, aur dono gol (number + tick) green</div>
<div class="eyebrow">SELECT ONE ANSWER</div>
<div class="card"><div class="chip">1</div><div class="paper">2√3 m/s</div><div class="tick"></div></div>
<div class="card greenOn"><div class="chip greenFill">2</div><div class="paper">4 m/s</div><div class="tick greenFill">✓</div></div>
<div class="card"><div class="chip">3</div><div class="paper">3√2 m/s</div><div class="tick"></div></div>
<div class="line"></div>
<span class="tag new">NAYA · LIKHE HUE OPTION WALE TEST</span>
<div class="text"><div class="letter">A</div><div style="flex:1">Ionic bond</div></div>
<div class="text" style="border:2px solid #4ADE80;background:#F0FBF3"><div class="letter" style="background:#16A34A;border-color:#16A34A;color:#fff">B</div><div style="flex:1;font-weight:800">Covalent bond</div><div class="tick greenFill">✓</div></div>
</div></body></html>
