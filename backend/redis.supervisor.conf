; Local cache service template. Copy into the supervisor include directory.
[program:jeelive-redis]
command=/root/.venv/bin/python /app/backend/redis_runtime.py
directory=/app/backend
autostart=true
autorestart=true
priority=15
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/jeelive-redis.out.log
stderr_logfile=/var/log/supervisor/jeelive-redis.err.log